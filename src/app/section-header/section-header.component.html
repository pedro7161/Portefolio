@if (compact) {
  <header class="section-header section-header-compact mb-8 pb-6 border-b border-border-soft">
    <div class="mb-3">
      <div class="eyebrow">{{ label }}</div>
      <h2 class="text-3xl font-display font-bold text-text-main mt-2">{{ title }}</h2>
    </div>
    <p class="text-text-muted leading-relaxed">{{ lead }}</p>
  </header>
} @else {
  <header class="section-header mb-10 pb-8 border-b border-border-soft">
    <div class="mb-4">
      <div class="eyebrow">{{ label }}</div>
      <h2 class="text-4xl font-display font-bold text-text-main mt-3">{{ title }}</h2>
    </div>
    <p class="text-text-muted text-lg leading-relaxed max-w-2xl">{{ lead }}</p>
  </header>
}
